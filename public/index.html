<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        .calculator {
            display: inline-block;
            padding: 30px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        input {
            width: 100px;
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 25px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 24px;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1>Simple Calculator</h1>

        <input
            type="number"
            id="num1"
            placeholder="Number 1"
        >

        <input
            type="number"
            id="num2"
            placeholder="Number 2"
        >

        <br><br>

        <button onclick="calculate()">Add</button>

        <div id="result">
            Result: -
        </div>

    </div>

    <script src="calculator.js"></script>

</body>
</html>
